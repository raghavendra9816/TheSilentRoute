<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Media - Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="admin.css"/>
</head>
<body>

  <div class="admin-wrapper">
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <i class="fas fa-mountain"></i>
          <div>
            <span class="logo-text">Silent Route</span>
            <span class="logo-sub">Admin Panel</span>
          </div>
        </div>
        <button class="sidebar-close" id="sidebarClose">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-title">Main</div>
        <a href="index.html" class="sidebar-link"><i class="fas fa-th-large"></i> Dashboard</a>
        <a href="upload.html" class="sidebar-link"><i class="fas fa-upload"></i> Upload Media</a>
        <a href="media.html" class="sidebar-link active"><i class="fas fa-photo-video"></i> Manage Media</a>
        <div class="nav-section-title">Users</div>
        <a href="users.html" class="sidebar-link"><i class="fas fa-users"></i> All Users</a>
        <a href="messages.html" class="sidebar-link"><i class="fas fa-envelope"></i> Messages</a>
        <div class="nav-section-title">Site</div>
        <a href="../index.html" class="sidebar-link" target="_blank"><i class="fas fa-globe"></i> View Website</a>
        <a href="#" class="sidebar-link logout-link" onclick="Auth.logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
      <div class="sidebar-user">
        <i class="fas fa-user-shield"></i>
        <div>
          <div id="adminName">Admin</div>
          <div class="sidebar-user-role">Administrator</div>
        </div>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="admin-page-title">Manage Media</h1>
        <div class="topbar-right">
          <a href="upload.html" class="btn-primary" style="font-size:0.85rem; padding:8px 18px;">
            <i class="fas fa-plus"></i> Upload New
          </a>
        </div>
      </div>

      <div class="admin-content">
        <!-- Filters -->
        <div class="admin-card" style="padding:16px 20px; margin-bottom:20px;">
          <div class="media-filters-row">
            <div class="gallery-search" style="max-width:300px; margin:0;">
              <input type="text" id="mediaSearch" placeholder="Search media..."/>
              <i class="fas fa-search"></i>
            </div>
            <div class="filter-group">
              <select id="typeFilter">
                <option value="all">All Types</option>
                <option value="image">Images</option>
                <option value="video">Videos</option>
              </select>
              <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="travel">Travel</option>
                <option value="nature">Nature</option>
                <option value="adventure">Adventure</option>
                <option value="culture">Culture</option>
                <option value="people">People</option>
                <option value="food">Food</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="result-info" id="resultInfo"></div>
          </div>
        </div>

        <!-- Media Table -->
        <div class="admin-card">
          <div class="card-body" style="padding:0;">
            <div id="mediaTableWrap">
              <div class="spinner" style="margin:40px auto;"></div>
            </div>
          </div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination" style="margin-top:20px;"></div>
      </div>
    </main>
  </div>

  <!-- EDIT MODAL -->
  <div class="modal" id="editModal">
    <div class="modal-overlay" onclick="closeModal('editModal')"></div>
    <div class="modal-box" style="max-width:560px;">
      <button class="modal-close" onclick="closeModal('editModal')">
        <i class="fas fa-times"></i>
      </button>
      <div class="modal-header">
        <i class="fas fa-edit"></i>
        <h3>Edit Media</h3>
      </div>
      <form id="editForm">
        <input type="hidden" id="editId"/>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="editTitle" required/>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="editDescription" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="editLocation"/>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="editCategory">
            <option value="travel">Travel</option>
            <option value="nature">Nature</option>
            <option value="adventure">Adventure</option>
            <option value="culture">Culture</option>
            <option value="people">People</option>
            <option value="food">Food</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tags (comma separated)</label>
          <input type="text" id="editTags"/>
        </div>
        <div style="display:flex; gap:20px; margin-bottom:16px;">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="editFeatured"/>
            <span>Featured</span>
          </label>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="editActive"/>
            <span>Active (Visible)</span>
          </label>
        </div>
        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;">
          <i class="fas fa-save"></i> Save Changes
        </button>
      </form>
    </div>
  </div>

  <!-- DELETE CONFIRM MODAL -->
  <div class="modal" id="deleteModal">
    <div class="modal-overlay" onclick="closeModal('deleteModal')"></div>
    <div class="modal-box" style="max-width:400px; text-align:center;">
      <div class="modal-header">
        <i class="fas fa-trash" style="color:#e94560;"></i>
        <h3>Delete Media</h3>
        <p>Are you sure? This action cannot be undone.</p>
      </div>
      <input type="hidden" id="deleteId"/>
      <div style="display:flex;gap:12px;justify-content:center;">
        <button class="btn-secondary" onclick="closeModal('deleteModal')">Cancel</button>
        <button class="btn-danger" onclick="confirmDelete()">
          <i class="fas fa-trash"></i> Yes, Delete
        </button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="media.js"></script>
</body>
</html>
