<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - The Silent Route</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/navbar.css"/>
  <link rel="stylesheet" href="css/modal.css"/>
  <link rel="stylesheet" href="css/footer.css"/>
</head>
<body>

  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <i class="fas fa-mountain"></i>
        <span>The Silent Route</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <div class="nav-auth" id="navAuth"></div>
      </div>
      <button class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <i class="fas fa-mountain"></i>
        <h2>Join The Route</h2>
        <p>Create your free account to download content</p>
      </div>

      <div class="auth-error" id="errorMsg"></div>

      <form id="registerForm">
        <div class="form-group">
          <label><i class="fas fa-user"></i> Username</label>
          <input type="text" id="username" placeholder="your_username" required minlength="3" maxlength="20"/>
        </div>

        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Email Address</label>
          <input type="email" id="email" placeholder="your@email.com" required/>
        </div>

        <div class="form-group">
          <label><i class="fas fa-lock"></i> Password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="Min 6 characters" required minlength="6"/>
            <button type="button" class="toggle-password" onclick="togglePassword('password')">
              <i class="fas fa-eye" id="password-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary submit-btn" id="submitBtn">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
      </form>

      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Login here</a></p>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script>
    if (Auth.isLoggedIn()) {
      window.location.href = '/index.html';
    }

    function togglePassword(fieldId) {
      const input = document.getElementById(fieldId);
      const eye = document.getElementById(`${fieldId}-eye`);
      input.type = input.type === 'password' ? 'text' : 'password';
      eye.className = input.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');

      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
      btn.disabled = true;
      errorMsg.classList.remove('show');

      try {
        const data = await API.post('/auth/register', {
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });

        Auth.saveUser(data.token, data.user);
        showToast('Account created successfully! Welcome! 🎉', 'success');

        setTimeout(() => {
          window.location.href = '/index.html';
        }, 1500);
      } catch (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.add('show');
        btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
