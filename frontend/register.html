<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register - The Silent Route</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/navbar.css"/>
  <link rel="stylesheet" href="css/modal.css"/>
  <link rel="stylesheet" href="css/footer.css"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar scrolled" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <i class="fas fa-mountain"></i>
        <span>The Silent Route</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="index.html"   class="nav-link">Home</a>
        <a href="gallery.html" class="nav-link">Gallery</a>
        <a href="videos.html"  class="nav-link">Videos</a>
        <div class="nav-auth"  id="navAuth"></div>
      </div>
      <button class="hamburger" id="hamburger">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- REGISTER PAGE -->
  <div class="auth-page">
    <div class="auth-card">

      <div class="auth-logo">
        <i class="fas fa-mountain"></i>
        <h2>Join The Route</h2>
        <p>Create your free account to download content</p>
      </div>

      <div class="auth-error" id="errorMsg"></div>

      <form id="registerForm">

        <div class="form-group">
          <label>
            <i class="fas fa-user"></i> Username
          </label>
          <input
            type="text"
            id="regUsername"
            placeholder="your_username"
            required
            minlength="3"
            maxlength="20"
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label>
            <i class="fas fa-envelope"></i> Email Address
          </label>
          <input
            type="email"
            id="regEmail"
            placeholder="your@email.com"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label>
            <i class="fas fa-lock"></i> Password
          </label>
          <div class="password-wrap">
            <input
              type="password"
              id="regPassword"
              placeholder="Minimum 6 characters"
              required
              minlength="6"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="toggle-password"
              onclick="togglePassword('regPassword', 'regEye')"
            >
              <i class="fas fa-eye" id="regEye"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="btn-primary submit-btn"
          id="registerBtn"
        >
          <i class="fas fa-user-plus"></i> Create Account
        </button>

      </form>

      <div class="auth-footer">
        <p>
          Already have an account?
          <a href="login.html">Login here</a>
        </p>
      </div>

    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>

  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) {
      window.location.href = 'index.html';
    }

    function togglePassword(inputId, eyeId) {
      const input = document.getElementById(inputId);
      const eye   = document.getElementById(eyeId);

      if (input.type === 'password') {
        input.type    = 'text';
        eye.className = 'fas fa-eye-slash';
      } else {
        input.type    = 'password';
        eye.className = 'fas fa-eye';
      }
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn      = document.getElementById('registerBtn');
      const errorMsg = document.getElementById('errorMsg');

      const username = document.getElementById('regUsername').value.trim();
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      errorMsg.textContent = '';
      errorMsg.classList.remove('show');

      if (!username || !email || !password) {
        errorMsg.textContent = 'Please fill in all fields.';
        errorMsg.classList.add('show');
        return;
      }

      if (password.length < 6) {
        errorMsg.textContent = 'Password must be at least 6 characters.';
        errorMsg.classList.add('show');
        return;
      }

      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
      btn.disabled  = true;

      try {
        const data = await API.post('/auth/register', {
          username,
          email,
          password
        });

        Auth.saveUser(data.token, data.user);
        showToast('Account created! Welcome to The Silent Route 🎉', 'success');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1500);

      } catch (error) {
        errorMsg.textContent = error.message || 'Registration failed. Try again.';
        errorMsg.classList.add('show');
        btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
        btn.disabled  = false;
      }
    });
  </script>

</body>
</html>
